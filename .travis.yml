---
language: ruby
services:
  - mysql
addons:
  apt:
    packages:
      - mysql-server
rvm:
  - 3.1.4
  - 3.2.3
  - 3.3.0
  - ruby-head

gemfile:
  - Gemfile
  - gemfiles/Gemfile.rails-7.1

matrix:
  allow-failures:
    - rvm: ruby-head

jobs:
  fast_finish: true

bundler_args: --jobs=3 --retry=3

before_install:
  - gem uninstall -v '>= 2' -i $(rvm gemdir)@global -ax bundler || true
  - gem install bundler -v 2.5.9
script:
  - bundle exec rspec

cache: bundler
sudo: false
